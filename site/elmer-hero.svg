<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Elmer, the agent turtle">
  <defs>
    <linearGradient id="shellG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b872"/>
      <stop offset="0.55" stop-color="#e6a15a"/>
      <stop offset="1" stop-color="#cf8640"/>
    </linearGradient>
    <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d6a6"/>
      <stop offset="1" stop-color="#e9b877"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.34" cy="0.26" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shellClip">
      <path d="M76 200 Q76 96 200 96 Q324 96 324 200 Z"/>
    </clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="205" cy="252" rx="152" ry="13" fill="#000000" opacity="0.28"/>

  <g stroke="#6d4322" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- back legs -->
    <path d="M118 196 L104 236 Q102 244 111 244 L126 244 Q132 244 133 236 L140 200 Z" fill="#d99a54"/>
    <path d="M286 196 L290 236 Q291 244 299 244 L314 244 Q322 244 320 236 L306 200 Z" fill="#d99a54"/>
    <!-- tail -->
    <path d="M86 186 L58 196 L88 204 Z" fill="url(#skinG)"/>
    <!-- head + neck -->
    <path d="M298 170 Q300 138 330 136 Q360 134 368 162 Q373 184 352 197 Q337 205 320 198 Z" fill="url(#skinG)"/>
    <!-- shell -->
    <path d="M76 200 Q76 96 200 96 Q324 96 324 200 Z" fill="url(#shellG)"/>
    <path d="M76 200 Q76 96 200 96 Q324 96 324 200 Z" fill="url(#spec)"/>
    <!-- shell scutes, clipped to the shell -->
    <g clip-path="url(#shellClip)" fill="none" stroke-width="3.6">
      <path d="M200 98 L200 202"/>
      <path d="M141 104 Q128 150 126 202"/>
      <path d="M259 104 Q272 150 274 202"/>
      <path d="M40 150 Q200 170 360 150"/>
      <path d="M50 116 Q150 134 200 133 Q250 134 350 116"/>
    </g>
    <!-- smile -->
    <path d="M336 176 Q344 187 359 180" fill="none" stroke-width="3.4"/>
  </g>

  <!-- eye -->
  <circle cx="347" cy="159" r="9" fill="#fff8ee"/>
  <circle cx="349" cy="160" r="4.6" fill="#2a1a0c"/>
  <circle cx="351" cy="158" r="1.5" fill="#fff8ee"/>
</svg>
