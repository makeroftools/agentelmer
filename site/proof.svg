    <path d="M340 166 h50" stroke="#8f83ff" stroke-width="2"/>
    <path d="M385 161 l8 5 -8 5" stroke="#8f83ff" stroke-width="2" fill="none"/>
    <rect x="400" y="146" width="200" height="40" rx="10" fill="none" stroke="#e8a45c" stroke-width="2"/>
    <text x="500" y="171" text-anchor="middle" fill="#e8a45c">sha256:1c2ba7…</text>

    <text x="590" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#f3f1ea">=</text>
