<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" role="img" aria-label="Every fractal component is enclosed in its own governance and security boundary">
  <g font-family="ui-monospace, monospace" font-size="12.5" fill="#a4aab3">
    <rect x="24" y="40" width="572" height="312" rx="22" fill="none" stroke="#57d1c6" stroke-width="1.8" stroke-dasharray="7 7"/>
    <text x="42" y="30" fill="#57d1c6">network boundary</text>

    <rect x="86" y="86" width="448" height="244" rx="20" fill="none" stroke="#8f83ff" stroke-width="1.8" stroke-dasharray="7 7"/>
    <text x="104" y="76" fill="#8f83ff">composite boundary — governs its children</text>

    <rect x="168" y="140" width="284" height="168" rx="18" fill="none" stroke="#e8a45c" stroke-width="2"/>
    <text x="186" y="130" fill="#e8a45c">component boundary</text>
  </g>

  <!-- the bounded agent: a domain expert with no reach -->
  <g transform="translate(310 226)">
    <circle r="34" fill="#12141a" stroke="#e8a45c" stroke-width="2.4"/>
    <path d="M0 -16 L13 -9 V6 C13 15 6 21 0 24 C-6 21 -13 15 -13 6 V-9 Z" fill="none" stroke="#e8a45c" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="0" cy="2" r="3.4" fill="#e8a45c"/>
  </g>
  <text x="310" y="286" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#a4aab3">a domain expert, with no ambient authority</text>
</svg>
